
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CarCare - Veículos</title>

    <!-- Materialize CSS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    >

    <!-- Material Icons -->
    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    >

    <!-- Estilos do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- MENU LATERAL -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <div class="logo-icon">
                <i class="material-icons">directions_car</i>
            </div>

            <div>
                <strong>CarCare</strong>
                <small>GESTÃO DE FROTA</small>
            </div>
        </div>

        <!-- NOVA MANUTENÇÃO -->
        <button
            type="button"
            class="btn blue-btn new-maintenance"
            onclick="novaManutencao()"
        >
            <i class="material-icons left">add</i>
            Nova Manutenção
        </button>

        <!-- NAVEGAÇÃO -->
        <nav class="menu">

            <a href="index.html">
                <i class="material-icons">dashboard</i>
                Dashboard
            </a>

            <a href="veiculos.html" class="active">
                <i class="material-icons">directions_car</i>
                Meus Veículos
            </a>

        </nav>

        <!-- MENU INFERIOR -->
        <div class="menu-bottom">

            <a href="#">
                <i class="material-icons">settings</i>
                Configurações
            </a>

            <a href="#">
                <i class="material-icons">help_outline</i>
                Suporte
            </a>

        </div>

    </aside>

    <!-- SOBREPOSIÇÃO DO MENU MOBILE -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-content">

        <!-- BARRA SUPERIOR -->
        <header class="topbar">

            <button
                type="button"
                class="mobile-menu-toggle"
                id="mobileMenuToggle"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="sidebar"
            >
                <i class="material-icons">menu</i>
            </button>

            <div class="search">
                <i class="material-icons">search</i>

                <input
                    type="text"
                    placeholder="Buscar..."
                    aria-label="Buscar"
                >
            </div>

            <div class="user">

                <i class="material-icons notification">
                    notifications_none
                </i>

                <span class="avatar">AD</span>

                <div>
                    <strong>Administrador</strong>
                    <small>Gestor de Frota</small>
                </div>

            </div>

        </header>

        <!-- CONTEÚDO -->
        <section class="content">

            <div class="page-header">

                <div>
                    <span class="subtitle">GERENCIAMENTO DA FROTA</span>

                    <h1>Meus veículos</h1>

                    <p>
                        Consulte e gerencie os veículos cadastrados.
                    </p>
                </div>
                <a href="novo-veiculo.html" class="btn blue-btn">
                    <i class="material-icons left">add</i>
                            Novo veículo
                        </a>

            </div>

            <!-- FILTROS -->
            <section class="vehicle-filters">

                <div class="vehicle-search">

                    <i class="material-icons">search</i>

                    <input
                        type="search"
                        id="vehicle-filter-input"
                        placeholder="Buscar por modelo ou placa..."
                        oninput="filterVehiclesList()"
                        aria-label="Buscar veículos por modelo ou placa"
                    >

                </div>

            </section>

            <!-- LISTA DE VEÍCULOS -->
            <section
                class="vehicle-list"
                id="vehicles-cards-container"
            >

                <!-- Os veículos serão carregados pelo app.js -->

            </section>

        </section>

    </main>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
